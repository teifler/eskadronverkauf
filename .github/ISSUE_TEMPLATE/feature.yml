name: Idee oder Wunsch
description: Neue Funktion, neue Sektion, Text- oder Designänderung.
labels: [enhancement]
body:
  - type: textarea
    id: ziel
    attributes:
      label: Was soll besser werden – und für wen?
      description: Das Problem oder Ziel, nicht gleich die Lösung.
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Idee zur Umsetzung
  - type: checkboxes
    id: betrifft
    attributes:
      label: Betrifft
      options:
        - label: Texte oder Artikel
        - label: Design oder Layout
        - label: Formulare oder Datenübertragung (→ Datenschutz prüfen)
        - label: Rechtliches
